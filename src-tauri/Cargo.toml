[package]
name = "devtoolbox"
version = "0.1.0"
description = "Free, open-source developer utilities toolbox"
authors = ["DevToolbox Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devtoolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
